<section class="hero">
	<div class="hero__wrapper">
		<img class="hero__bg" srcset="@img/hero-main/bg@2x.jpg 2x" src="@img/hero-main/bg.jpg" width="1880" height="781" fetchpriority="high" alt="">
		<div class="hero__container">
			<div class="hero__body">
				<div class="hero__objects objects">
					<ul class="objects__list">
						<li class="objects__item">
							<img srcset="@img/hero-main/1@2x.png 2x" src="@img/hero-main/1.png" width="48" height="48" alt="">
						</li>
						<li class="objects__item">
							<img srcset="@img/hero-main/2@2x.png 2x" src="@img/hero-main/2.png" width="48" height="48" alt="">
						</li>
						<li class="objects__item">
							<img srcset="@img/hero-main/3@2x.png 2x" src="@img/hero-main/3.png" width="48" height="48" alt="">
						</li>
						<li class="objects__item">
							<img srcset="@img/hero-main/4@2x.png 2x" src="@img/hero-main/4.png" width="48" height="48" alt="">
						</li>
					</ul>
					<div class="objects__info">
						<div class="objects__count">800+</div>
						<div class="objects__descr">успешно выполненных объектов</div>
					</div>
				</div>
				<h1 class="hero__title">Качественный ремонт квартир</h1>

				<div class="hero__descr">Оставьте заявку и получите дизайн-проект в подарок</div>
				<button class="hero__btn btn" type="button">
					<span>Оставить заявку</span>
					<span>
						<svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M2.23542 1.31347L10.2934 0.99999L9.97992 9.05798M10.2934 0.99999L0.999998 10.2934" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
						</svg>
					</span>
				</button>
			</div>
			<div class="hero__guarantee guarantee">
				<div class="guarantee__text">Сделаем ремонт <span>точно в срок</span> или <span>вернем деньги</span><sup>*</sup></div>
				<div class="guarantee__image">
					<img srcset="@img/hero-main/decor@2x.png 2x" src="@img/hero-main/decor.png" width="190" height="217" alt="">
				</div>
			</div>
		</div>
	</div>
