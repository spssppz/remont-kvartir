<section class="calc">
	<div class="calc__wrapper">
		<img class="calc__bg" srcset="@img/calc/bg@2x.jpg 2x" src="@img/calc/bg.jpg" width="1500" height="805" loading="lazy" alt="">
		<div class="calc__container">
			<div class="calc-cost">
				<h2 class="calc-cost__title">Хотите узнать стоимость ремонта?</h2>
				<ul class="calc-cost__cols">
					<li class="calc-cost__col">
						<div class="calc-cost__cap">Количество комнат:</div>
						<div class="calc-cost__checkbox">
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">Студия</span>
							</label>
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">1-комнатная</span>
							</label>
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">2-комнатная</span>
							</label>
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">3-комнатная</span>
							</label>
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">4-комнатная</span>
							</label>
						</div>
					</li>
					<li class="calc-cost__col">
						<div class="calc-cost__cap">Укажите тип дома:</div>
						<div class="calc-cost__checkbox">
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">Новостройка</span>
							</label>
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">Вторичка</span>
							</label>
						</div>
					</li>
					<li class="calc-cost__col">
						<div class="calc-cost__cap">Вид ремонта:</div>
						<div class="calc-cost__checkbox">
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">Под ключ</span>
							</label>
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">Дизайнерский</span>
							</label>
							<label class="checkbox">
								<input class="checkbox__input" type="checkbox" value="1" name="form[]">
								<span class="checkbox__text">Черновой</span>
							</label>
						</div>
					</li>
					<li class="calc-cost__col">
						<div class="calc-cost__cap">Площадь, кв.м:</div>
						<input class="calc-cost__input input" type="text" name="form[]" placeholder="">
					</li>
				</ul>
			</div>
			<form class="calc-form" action="#">
				<div class="calc-form__title">При заказе <span>дизайн-проект в подарок</span></div>
				<input class="calc-form__input input" type="text" name="form[]" placeholder="+7 (___) ___-__-__">
				<button class="calc-form__btn btn">Получить точную смету</button>
				<label class="checkbox">
					<input class="checkbox__input" type="checkbox" value="1" name="form[]">
					<span class="checkbox__text">
						Соглашаюсь с <a href="" target="_blank">обработкой персональных данных</a> и <a href="" target="_blank">политикой конфиденциальности</a>
					</span>
				</label>
			</form>
		</div>
	</div>
</section>
