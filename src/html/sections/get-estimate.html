<section class="get-estimate">
	<div class="get-estimate__wrapper">
		<img class="get-estimate__bg" srcset="@img/get-estimate/bg@2x.jpg 2x" src="@img/get-estimate/bg.jpg" width="1500" height="660" loading="lazy" alt="">
		<div class="get-estimate__container">
			<div class="get-estimate__body">
				<div class="get-estimate__content">
					<h2 class="get-estimate__title title">
						Как получить подробную смету бесплатно?
					</h2>
					<div class="get-estimate__descr">Мы готовы рассказать о себе всё и о процессе ремонта</div>
					<div class="get-estimate__image">
						<img srcset="@img/get-estimate/docs@2x.png 2x" src="@img/get-estimate/docs.png" width="253" height="154" loading="lazy" alt="">
					</div>
				</div>
				<div class="get-estimate__decor">
					<img srcset="@img/get-estimate/girl@2x.png 2x" src="@img/get-estimate/girl.png" width="533" height="686" loading="lazy" alt="">
					<div class="get-estimate__decor-descr">
						<span>Наталья</span>
						<span>Дизайнер «Ремонт квартир»</span>
					</div>
				</div>
				<form class="callback-form" action="#">
					<div class="callback-form__label">Заполните форму ниже</div>
					<input class="callback-form__input input" type="text" name="callback_name" placeholder="Ваше имя">
					<input class="callback-form__input input" type="text" name="callback_phone" placeholder="+7 (___) ___-__-__">
					<button class="callback-form__btn btn">Получить точную смету</button>
					<label class="callback-form__checkbox checkbox">
						<input class="checkbox__input" type="checkbox" value="1" name="form[]">
						<span class="checkbox__text">
							Соглашаюсь с <a href="" target="_blank">обработкой персональных данных</a> и <a href="" target="_blank">политикой конфиденциальности</a>
						</span>
					</label>
				</form>
			</div>
		</div>
	</div>
</section>
